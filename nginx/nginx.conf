worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1024;

    # APK file extension
    types {
        application/vnd.android.package-archive apk;
        application/java-archive jar;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 500m;

        # ----------------------------------------------------------
        # Public F-Droid repo path (PUBLIC apps only)
        # Served from disk via X-Accel-Redirect from the backend.
        # The backend authorizes the request and either returns the
        # file directly or asks nginx to serve it from /_protected/
        # ----------------------------------------------------------
        location /fdroid/repo/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # Internal location used by the backend to delegate file
        # serving to nginx for performance. Not reachable directly.
        location /_protected/ {
            internal;
            alias /data/storage/;
        }

        # Everything else (admin/client UI) goes to the API for now.
        # In production you would also reverse-proxy the Next.js frontend here.
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
