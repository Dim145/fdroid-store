worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1024;

    # APK file extension
    types {
        application/vnd.android.package-archive apk;
        application/java-archive jar;
    }

    # Re-resolve `backend` against Docker's embedded DNS server (127.0.0.11)
    # at request time rather than caching the IP at config-load. Without
    # this, restarting the backend container yields a new IP and nginx
    # keeps proxying to the dead one (→ 502 connection refused).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        client_max_body_size 500m;

        # ----------------------------------------------------------
        # F-Droid repo path (public + auth via Basic auth → private)
        # ----------------------------------------------------------
        location /fdroid/repo/ {
            set $upstream_backend backend:8000;
            proxy_pass http://$upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        location /r/* {
            set $upstream_backend backend:8000;
            proxy_pass http://$upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # Internal location used by the backend to delegate file
        # serving to nginx for performance. Not reachable directly.
        location /_protected/ {
            internal;
            alias /data/storage/;
        }

        # Everything else (admin/client UI) goes to the API.
        location / {
            set $upstream_backend backend:8000;
            proxy_pass http://$upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
