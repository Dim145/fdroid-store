# Build and publish the backend + frontend + worker + reference F-Droid
# proxy container images to GHCR every time a GitHub release is created.
# The same image artefacts are reused on any host because no URL is baked
# in at build time (see the Dockerfiles).
#
# Pulling the published images:
#   docker pull ghcr.io/<owner>/<repo>-backend:<tag>
#   docker pull ghcr.io/<owner>/<repo>-frontend:<tag>
#   docker pull ghcr.io/<owner>/<repo>-worker:<tag>
#   docker pull ghcr.io/<owner>/<repo>-proxy-fdroid:<tag>
#
# Image relationship: the worker FROMs the backend image. To guarantee
# the worker is always built against the matching backend (not yesterday's
# ``:latest`` from the registry while the new one is still pushing), the
# worker job DEPENDS on the backend job and consumes the **immutable
# content digest** of what backend just pushed — not its tag. Tags can
# race; ``@sha256:…`` cannot.
name: Publish container images

on:
  release:
    types: [published]
  # Manual run for one-off publishes (e.g. patching an old release without
  # re-tagging). Only pushes the exact ``{{version}}`` (when run on a tag)
  # and ``sha-…`` tags: the floating ``{{major}}.{{minor}}`` / ``{{major}}``
  # / ``latest`` tags move on release events only, so re-running an old tag
  # can't point them back at an older build.
  workflow_dispatch:

# One publish at a time, in trigger order: two releases created minutes
# apart must not race on the floating tags (the older build finishing last
# would move ``latest`` / ``{{major}}`` backwards). Never cancel a running
# publish half-way. GitHub keeps one pending run per group, so with three
# releases in quick succession the middle one is dropped — re-run it from
# the Actions tab (workflow_dispatch on its tag) if that ever happens.
concurrency:
  group: publish-images
  cancel-in-progress: false

# GHCR push only needs read access to the source + write to packages; deny
# the rest so a compromised step can't escalate.
permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------
  # Backend (API) image — must finish before the worker job starts.
  # --------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    outputs:
      # The worker job FROMs ``${IMAGE}@${digest}`` to guarantee it
      # layers on top of the SAME backend bytes that just got pushed.
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image name
        id: name
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: true
          sbom: true

  # --------------------------------------------------------------------
  # Frontend image — independent of backend, runs in parallel.
  # --------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: true
          sbom: true

  # --------------------------------------------------------------------
  # Worker image — extends the backend image. Pinned by digest so a
  # concurrent re-run of the workflow can't accidentally make us layer
  # on top of an older ``:latest`` that's still being pushed by the
  # other run.
  # --------------------------------------------------------------------
  worker:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-worker" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      # Pinning the FROM by digest is the whole point of this job's
      # ``needs: backend``. Tag-only would race: if a second run of
      # this workflow (e.g. retry, or two releases minutes apart)
      # overlaps with the first, the worker could end up FROMing a
      # backend image that's still propagating to the registry — or
      # worse, a NEWER backend than the one we just signed off on.
      # The digest (sha256:…) is content-addressable and locks the
      # worker layer to the EXACT backend bytes this workflow run
      # produced.
      - name: Build and push (FROMs backend@digest)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_IMAGE=${{ needs.backend.outputs.image }}@${{ needs.backend.outputs.digest }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          provenance: true
          sbom: true

  # --------------------------------------------------------------------
  # Reference F-Droid source proxy (proxy/fdroid, ``proxy-fdroid`` compose
  # profile) — independent of the others, runs in parallel.
  # --------------------------------------------------------------------
  proxy-fdroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-proxy-fdroid" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./proxy/fdroid
          file: ./proxy/fdroid/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=proxy-fdroid
          cache-to: type=gha,mode=max,scope=proxy-fdroid
          provenance: true
          sbom: true
