# Build and publish the backend + frontend container images to GHCR every
# time a GitHub release is created. The same image artefact is reused on
# any host because no URL is baked in at build time (see the Dockerfiles).
#
# Pulling the published images:
#   docker pull ghcr.io/<owner>/<repo>-backend:<tag>
#   docker pull ghcr.io/<owner>/<repo>-frontend:<tag>
name: Publish container images

on:
  release:
    types: [published]
  # Manual run for one-off publishes (e.g. patching an old release without
  # re-tagging). Doesn't update ``latest`` because there's no release ref.
  workflow_dispatch:

# GHCR push only needs read access to the source + write to packages; deny
# the rest so a compromised step can't escalate.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Don't block the other image's publish if one fails — each is built
    # in its own job and pushed independently.
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR rejects mixed-case repository names. ``${GITHUB_REPOSITORY,,}``
      # downcases ``owner/Repo`` to ``owner/repo`` so the same workflow
      # works on a fork called e.g. ``MyOrg/FDroid-Store``.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the tag list from the release ref:
      #   v1.2.3        → 1.2.3, 1.2, 1, latest
      #   v1.2.3-rc1    → 1.2.3-rc1            (no major/minor/latest for prereleases)
      # workflow_dispatch runs produce only the raw ``sha-<commit>`` tag.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions registry-backed cache: speeds up subsequent
          # releases dramatically (the Python venv + jlink JDK layers
          # for the backend take a while to rebuild from scratch).
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true
