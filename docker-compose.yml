name: fdroid-store

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdroid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fdroid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdroid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional ClamAV scanner. The official image bundles ``freshclam``
  # (signature updater) and ``clamd`` (the daemon) in one container. On a
  # cold start, freshclam downloads ~250 MB of definitions; that's why
  # ``clamav_db`` is persisted across restarts and the healthcheck has a
  # generous ``start_period``.
  #
  # Opt-in: this service only runs when the ``clamav`` compose profile is
  # active (``docker compose --profile clamav up -d``). When it's off, the
  # backend's CLAMAV_HOST is unset and the feature stays disabled. The
  # admin UI surfaces the toggles only after the env var is present, so
  # forgetting to enable the profile won't break uploads.
  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:stable-debian
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      # The image ships ``clamdcheck.sh`` which talks the clamd PING
      # protocol on /run/clamav/clamd.sock and returns 0 on PONG.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      # Definitions take 3-5 min to download on first launch; clamd won't
      # accept connections until that completes.
      start_period: 5m
      retries: 5

  backend:
    image: ghcr.io/dim145/fdroid-store-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fdroid}:${POSTGRES_PASSWORD:-changeme_postgres}@postgres:5432/${POSTGRES_DB:-fdroid}
      REDIS_URL: redis://redis:6379/0
      # ClamAV is opt-in: defaults to empty (feature off). To enable, set
      # CLAMAV_HOST=clamav in .env and bring the stack up with
      # ``docker compose --profile clamav up -d`` so the scanner container
      # is actually scheduled.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_MAX_STREAM_MB: ${CLAMAV_MAX_STREAM_MB:-100}
      # Optional PATs used for the release auto-fetch feature (one per
      # forge). Without them we hit each provider's anonymous limit
      # (60 req/h on GitHub). Provide a fine-grained or classic PAT
      # with read access; private repos require the appropriate scope
      # on each side.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      # Working directory for the admin Backup feature. /tmp is a 512 MB
      # tmpfs in our lockdown profile; the backup working set can easily
      # exceed that on real-sized repos. Point at the persistent volume
      # mounted below so the feature has room to breathe.
      BACKUP_TMP_DIR: /data/backup-tmp
    # Lock the image down at runtime. ``read_only`` makes the entire root
    # filesystem immutable; the few paths the app legitimately writes to
    # are explicitly enumerated below as tmpfs (ephemeral, sized) or named
    # volumes (persisted). ``no-new-privileges`` blocks any setuid escape
    # from inside the container.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
      - /home/fdroid:rw,size=64m,uid=1001,gid=1001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      - keystore_data:/data/keystores
      # Working dir for the admin Backup feature (see BACKUP_TMP_DIR
      # above). The default /tmp is a 512 MB tmpfs, too small for the
      # backup working set on real-sized repos.
      - backup_tmp:/data/backup-tmp
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/dim145/fdroid-store-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fdroid}:${POSTGRES_PASSWORD:-changeme_postgres}@postgres:5432/${POSTGRES_DB:-fdroid}
      REDIS_URL: redis://redis:6379/0
      # ClamAV is opt-in: defaults to empty (feature off). To enable, set
      # CLAMAV_HOST=clamav in .env and bring the stack up with
      # ``docker compose --profile clamav up -d`` so the scanner container
      # is actually scheduled.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_MAX_STREAM_MB: ${CLAMAV_MAX_STREAM_MB:-100}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      # Mirror the backend's backup temp dir env so the worker writes
      # produced tarballs where the backend will later stream them
      # from. Both bind the same ``backup_tmp`` volume below.
      BACKUP_TMP_DIR: /data/backup-tmp
    command: ["python", "-m", "arq", "app.workers.tasks.WorkerSettings"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
      - /home/fdroid:rw,size=64m,uid=1001,gid=1001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      - keystore_data:/data/keystores
      # Shared with the backend so the worker can write the backup
      # output where the streaming download endpoint can find it.
      - backup_tmp:/data/backup-tmp

  # Single nginx-served frontend image: static SPA + reverse-proxy to the
  # backend + nginx-served /_protected for X-Accel-Redirect downloads. No
  # URL is baked in at build time, so this image can be pushed to a registry
  # and reused on any host (only ``UPSTREAM_BACKEND`` is needed at runtime).
  frontend:
    image: ghcr.io/dim145/fdroid-store-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      UPSTREAM_BACKEND: backend:8000
      # Set ENABLE_HSTS=1 in your .env when the deployment is behind TLS.
      # Defaults off so local HTTP testing isn't broken by browsers
      # pinning HSTS after a single visit.
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    # Same lockdown as the backend. nginx writes its pid to /tmp (the
    # unprivileged base image already moved it there), and the official
    # entrypoint expands /etc/nginx/templates → /etc/nginx/conf.d at start,
    # which needs a writable conf.d. Both are sized tmpfs so a crash loop
    # can't fill the host's RAM.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
      - /var/cache/nginx:rw,size=64m,uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:rw,size=4m,uid=101,gid=101,mode=0755
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/data/storage:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
  keystore_data:
  # Holds the in-progress tarball / extraction tree while the admin
  # Backup feature runs. Wiped opportunistically by the service code;
  # nothing here survives across restore cycles intentionally.
  backup_tmp:
  # Persisted across restarts so freshclam doesn't re-download the full
  # signature DB every time the container starts.
  clamav_db:
