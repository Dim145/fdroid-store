name: fdroid-store

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdroid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fdroid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdroid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/dim145/fdroid-store-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fdroid}:${POSTGRES_PASSWORD:-changeme_postgres}@postgres:5432/${POSTGRES_DB:-fdroid}
      REDIS_URL: redis://redis:6379/0
    # Lock the image down at runtime. ``read_only`` makes the entire root
    # filesystem immutable; the few paths the app legitimately writes to
    # are explicitly enumerated below as tmpfs (ephemeral, sized) or named
    # volumes (persisted). ``no-new-privileges`` blocks any setuid escape
    # from inside the container.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
      - /home/fdroid:rw,size=64m,uid=1001,gid=1001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      - keystore_data:/data/keystores
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/dim145/fdroid-store-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fdroid}:${POSTGRES_PASSWORD:-changeme_postgres}@postgres:5432/${POSTGRES_DB:-fdroid}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "arq", "app.workers.tasks.WorkerSettings"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
      - /home/fdroid:rw,size=64m,uid=1001,gid=1001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      - keystore_data:/data/keystores

  # Single nginx-served frontend image: static SPA + reverse-proxy to the
  # backend + nginx-served /_protected for X-Accel-Redirect downloads. No
  # URL is baked in at build time, so this image can be pushed to a registry
  # and reused on any host (only ``UPSTREAM_BACKEND`` is needed at runtime).
  frontend:
    image: ghcr.io/dim145/fdroid-store-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      UPSTREAM_BACKEND: backend:8000
      # Set ENABLE_HSTS=1 in your .env when the deployment is behind TLS.
      # Defaults off so local HTTP testing isn't broken by browsers
      # pinning HSTS after a single visit.
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    # Same lockdown as the backend. nginx writes its pid to /tmp (the
    # unprivileged base image already moved it there), and the official
    # entrypoint expands /etc/nginx/templates → /etc/nginx/conf.d at start,
    # which needs a writable conf.d. Both are sized tmpfs so a crash loop
    # can't fill the host's RAM.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
      - /var/cache/nginx:rw,size=64m,uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:rw,size=4m,uid=101,gid=101,mode=0755
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/data/storage:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
  keystore_data:
