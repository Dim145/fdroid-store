name: fdroid-store

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdroid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fdroid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdroid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional ClamAV scanner. The official image bundles ``freshclam``
  # (signature updater) and ``clamd`` (the daemon) in one container. On a
  # cold start, freshclam downloads ~250 MB of definitions; that's why
  # ``clamav_db`` is persisted across restarts and the healthcheck has a
  # generous ``start_period``.
  #
  # Opt-in: this service only runs when the ``clamav`` compose profile is
  # active (``docker compose --profile clamav up -d``). When it's off, the
  # backend's CLAMAV_HOST is unset and the feature stays disabled. The
  # admin UI surfaces the toggles only after the env var is present, so
  # forgetting to enable the profile won't break uploads.
  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:stable-debian
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      # The image ships ``clamdcheck.sh`` which talks the clamd PING
      # protocol on /run/clamav/clamd.sock and returns 0 on PONG.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      # Definitions take 3-5 min to download on first launch; clamd won't
      # accept connections until that completes.
      start_period: 5m
      retries: 5

  backend:
    image: ghcr.io/dim145/fdroid-store-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fdroid}:${POSTGRES_PASSWORD:-changeme_postgres}@postgres:5432/${POSTGRES_DB:-fdroid}
      REDIS_URL: redis://redis:6379/0
      # ClamAV is opt-in: defaults to empty (feature off). To enable, set
      # CLAMAV_HOST=clamav in .env and bring the stack up with
      # ``docker compose --profile clamav up -d`` so the scanner container
      # is actually scheduled.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_MAX_STREAM_MB: ${CLAMAV_MAX_STREAM_MB:-100}
      # Trivy server URL. The backend itself never scans — only the
      # worker does — but it needs to see the env var to compute
      # ``settings.trivy_available`` for the admin UI + reject toggle
      # flips when no scanner is wired in.
      TRIVY_SERVER_URL: ${TRIVY_SERVER_URL:-}
      # Optional PATs used for the release auto-fetch feature (one per
      # forge). Without them we hit each provider's anonymous limit
      # (60 req/h on GitHub). Provide a fine-grained or classic PAT
      # with read access; private repos require the appropriate scope
      # on each side.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      # Working directory for the admin Backup feature. /tmp is a 512 MB
      # tmpfs in our lockdown profile; the backup working set can easily
      # exceed that on real-sized repos. Point at the persistent volume
      # mounted below so the feature has room to breathe.
      BACKUP_TMP_DIR: /data/backup-tmp
      # Serve local-storage APK downloads via nginx X-Accel-Redirect (the
      # frontend defines /_protected/ and mounts storage_data read-only), so
      # large APKs stream via sendfile with native Range/resume instead of
      # through Python. Set to 0 if you front the backend with an nginx that
      # lacks the /_protected/ location.
      X_ACCEL_REDIRECT_ENABLED: ${X_ACCEL_REDIRECT_ENABLED:-1}
    # Lock the image down at runtime. ``read_only`` makes the entire root
    # filesystem immutable; the few paths the app legitimately writes to
    # are explicitly enumerated below as tmpfs (ephemeral, sized) or named
    # volumes (persisted). ``no-new-privileges`` blocks any setuid escape
    # from inside the container.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
      - /home/fdroid:rw,size=64m,uid=1001,gid=1001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      - keystore_data:/data/keystores
      # Working dir for the admin Backup feature (see BACKUP_TMP_DIR
      # above). The default /tmp is a 512 MB tmpfs, too small for the
      # backup working set on real-sized repos.
      - backup_tmp:/data/backup-tmp
    # Bind to the host LOOPBACK only. The backend trusts ``X-Forwarded-For``
    # for per-IP rate limiting (the frontend nginx overwrites it with the
    # real client IP). If the API port were published on 0.0.0.0, any remote
    # client could hit the API directly and forge ``X-Forwarded-For`` to
    # evade the auth-endpoint rate limits — so it's reachable only from the
    # host itself (local dev / curl), never from the network. Production
    # traffic always goes through the frontend on :8080.
    #
    # Host port is 8011 (not 8000) purely to dodge a common local collision
    # on 8000; the in-container port stays 8000, so the frontend's
    # ``UPSTREAM_BACKEND=backend:8000`` and everything on the compose network
    # is unaffected. Change the left-hand number if 8011 is also taken.
    ports:
      - "127.0.0.1:8011:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/dim145/fdroid-store-worker:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        # The worker FROMs the API image. Keep the tag in sync so a
        # ``docker compose build`` always rebuilds against the freshly-
        # baked API. CI can override this with a pinned version.
        API_IMAGE: ghcr.io/dim145/fdroid-store-backend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fdroid}:${POSTGRES_PASSWORD:-changeme_postgres}@postgres:5432/${POSTGRES_DB:-fdroid}
      REDIS_URL: redis://redis:6379/0
      # ClamAV is opt-in: defaults to empty (feature off). To enable, set
      # CLAMAV_HOST=clamav in .env and bring the stack up with
      # ``docker compose --profile clamav up -d`` so the scanner container
      # is actually scheduled.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_MAX_STREAM_MB: ${CLAMAV_MAX_STREAM_MB:-100}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      # Mirror the backend's backup temp dir env so the worker writes
      # produced tarballs where the backend will later stream them
      # from. Both bind the same ``backup_tmp`` volume below.
      BACKUP_TMP_DIR: /data/backup-tmp
      # CVE scanner: when set, the worker's trivy CLI talks to the
      # trivy server container at this URL (in CLIENT mode — file
      # parsing happens worker-side, DB lookups go to the server).
      # Empty / unset → CVE scanning is disabled; the worker task
      # marks every queued scan as SKIPPED.
      TRIVY_SERVER_URL: ${TRIVY_SERVER_URL:-}
    command: ["python", "-m", "arq", "app.workers.tasks.WorkerSettings"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
      - /home/fdroid:rw,size=64m,uid=1001,gid=1001,mode=0700
    volumes:
      - storage_data:/data/storage
      - keystore_data:/data/keystores
      # Shared with the backend so the worker can write the backup
      # output where the streaming download endpoint can find it.
      - backup_tmp:/data/backup-tmp
    # arq publishes a heartbeat key in Redis on every cycle (default
    # interval 60 s, TTL 90 s); ``--check`` reads it and returns 0
    # iff fresh. If Redis is unreachable or the worker stopped pumping,
    # exit is non-zero and compose flips the container to unhealthy.
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "app.workers.tasks.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional Trivy server — runs the official aquasec/trivy image in
  # ``server`` mode. The worker's trivy CLI talks to it via HTTP when
  # ``TRIVY_SERVER_URL`` is set on the worker (see env above). The server
  # owns the vulnerability database (~200 MB on disk, refreshed daily by
  # trivy itself) and clients only do file-side parsing — so the worker
  # doesn't carry the DB and only one container needs to refresh it.
  #
  # Opt-in: this service only runs under the ``trivy`` compose profile.
  # ``docker compose --profile trivy up -d`` brings it up; without the
  # profile + ``TRIVY_SERVER_URL`` unset, the CVE feature is automatically
  # disabled (the worker task short-circuits to ``skipped``).
  trivy:
    image: aquasec/trivy:0.70.0
    profiles: ["trivy"]
    restart: unless-stopped
    command: ["server", "--listen", "0.0.0.0:4954", "--cache-dir", "/cache"]
    volumes:
      - trivy_cache:/cache
    # Internal-only: the worker connects via the compose network. No
    # host port published — Trivy server has no auth and shouldn't be
    # exposed externally.
    expose:
      - "4954"

  # Reference APK source proxy speaking the v1 source-proxy protocol
  # (see docs/proxy-protocol.md) against any F-Droid-compatible repo
  # — official f-droid.org, IzzyOnDroid, Guardian Project, another
  # fdroid-store instance, …. ~350 lines of FastAPI + httpx, no
  # persistent state, no JDK / native deps.
  #
  # Opt-in via the ``proxy-fdroid`` compose profile. After ``docker
  # compose --profile proxy-fdroid up -d``, register the proxy in
  # fdroid-store's /admin/sources/proxies UI with:
  #   * Base URL: http://proxy-fdroid:8000
  #   * Shared secret: same as ``PROXY_FDROID_SECRET`` below
  #
  # Without the profile + ``PROXY_FDROID_SECRET`` unset, this service
  # stays down and fdroid-store simply doesn't see the F-Droid provider
  # in any catalogue.
  proxy-fdroid:
    profiles: ["proxy-fdroid"]
    image: ghcr.io/dim145/fdroid-store-proxy-fdroid:latest
    build:
      context: ./proxy/fdroid
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Shared bearer secret the fdroid-store backend will use to
      # authenticate every /sources + /resolve call. Empty = open
      # mode (deployments on isolated networks may prefer that).
      PROXY_SHARED_SECRET: ${PROXY_FDROID_SECRET:-}
    # Same lockdown shape as the other services. The proxy is stateless
    # — no volume, no writable surface beyond /tmp.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
    # Internal-only: the worker dials it via the compose network. No
    # host port published — admins should never expose proxies to the
    # public internet directly.
    expose:
      - "8000"

  # Single nginx-served frontend image: static SPA + reverse-proxy to the
  # backend + nginx-served /_protected for X-Accel-Redirect downloads. No
  # URL is baked in at build time, so this image can be pushed to a registry
  # and reused on any host (only ``UPSTREAM_BACKEND`` is needed at runtime).
  frontend:
    image: ghcr.io/dim145/fdroid-store-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      UPSTREAM_BACKEND: backend:8000
      # Set ENABLE_HSTS=1 in your .env when the deployment is behind TLS.
      # Defaults off so local HTTP testing isn't broken by browsers
      # pinning HSTS after a single visit.
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    # Same lockdown as the backend. nginx writes its pid to /tmp (the
    # unprivileged base image already moved it there), and the official
    # entrypoint expands /etc/nginx/templates → /etc/nginx/conf.d at start,
    # which needs a writable conf.d. Both are sized tmpfs so a crash loop
    # can't fill the host's RAM.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
      - /var/cache/nginx:rw,size=64m,uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:rw,size=4m,uid=101,gid=101,mode=0755
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/data/storage:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
  keystore_data:
  # Holds the in-progress tarball / extraction tree while the admin
  # Backup feature runs. Wiped opportunistically by the service code;
  # nothing here survives across restore cycles intentionally.
  backup_tmp:
  # Trivy's downloaded vulnerability DB (~200 MB). Updates daily on
  # first scan of the day. Persisting it keeps subsequent scans
  # fast across worker restarts.
  trivy_cache:
  # Persisted across restarts so freshclam doesn't re-download the full
  # signature DB every time the container starts.
  clamav_db:
