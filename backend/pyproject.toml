[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdroid-store-backend"
version = "1.1.0"
description = "Self-hosted F-Droid repository backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136",
    "uvicorn[standard]>=0.47",
    # Stay on the 2.0 line until 2.1 GAs — 2.1 drops the implicit greenlet
    # install we rely on for async, and at this scope a major-version bump
    # in the DB layer wants its own validation run.
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.18",
    "asyncpg>=0.31",
    "psycopg2-binary>=2.9",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    # passlib has been unmaintained since 2020 and breaks on Python 3.13
    # (the stdlib ``crypt`` module went away). pwdlib is the FastAPI-Users-
    # backed replacement; we keep both hashers installed so existing bcrypt
    # rows still verify while new passwords default to argon2.
    "pwdlib[argon2,bcrypt]>=0.2",
    # python-jose has been abandoned; PyJWT is the FastAPI-recommended
    # successor. 2.12.1 patches CVE-2026-32597 (``crit`` header handling).
    "PyJWT[crypto]>=2.12.1",
    # 0.0.20 has two CVEs (path traversal + DoS); 0.0.28 fixes both.
    "python-multipart>=0.0.28",
    "authlib>=1.7",
    "httpx>=0.28",
    "arq>=0.28",
    # redis-py 7.x is out, but arq 0.28 still pins ``redis<6``; the bump has
    # to wait until arq lifts its bound (or we swap out the queue). Staying
    # on the 5.x line keeps pip resolution happy and matches arq's tested
    # surface.
    "redis>=5.2,<6",
    "androguard>=4.1.3",
    "Pillow>=12.2",
    "aiofiles>=25.1",
    "aioboto3>=15.5",
    "email-validator>=2.2",
    "structlog>=25.5",
    "itsdangerous>=2.2",
    # Per-IP rate limiting for the auth endpoints. ``slowapi`` is the
    # FastAPI-shaped wrapper over ``limits``; the in-memory storage is
    # fine for single-instance deployments, and the docs show a Redis
    # back-end if we ever scale out workers.
    "slowapi>=0.1.9",
    # Parsing pasted upstream metadata.yml (fdroiddata format) on the
    # New App page. SafeLoader only, no arbitrary type instantiation.
    "PyYAML>=6.0",
    # TOTP (RFC 6238) two-factor authentication.
    "pyotp>=2.9",
    # QR code rendering for the TOTP enrolment screen. Tiny pure-Python
    # dep, no native bindings.
    "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
